[project]
name = "saint-elmo-mcp"
version = "0.1.0"
description = "MCP server that lets purchasing agents use the Saint Elmo backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
saint-elmo-mcp = "saint_elmo_mcp:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
