default_install_hook_types: [pre-commit, prepare-commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        name: ruff check (saint-elmo-backend)
        args: [--fix]
        files: ^saint-elmo-backend/
      - id: ruff-format
        name: ruff format (saint-elmo-backend)
        files: ^saint-elmo-backend/
  - repo: local
    hooks:
      - id: prefix-issue-number
        name: prefix commit message with issue number
        entry: scripts/prefix-issue-number.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true
